<!-- App Header & Navigation Tabs -->
<header class="glass-card p-5 mb-5 flex flex-col gap-4 relative">
  <div class="flex justify-between items-start">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="txt-badge font-bold tracking-widest text-teal-700 uppercase bg-gradient-to-r from-[#FFDFDF] to-[#DCF7EA] px-3 py-1 rounded-full border border-white shadow-sm">
          사랑과 평안의 교회 🎚 음향실
        </span>
      </div>
      <h1 class="txt-title font-extrabold text-stone-800 mt-1 flex items-center gap-2 tracking-tight">
        사운드 체크리스트
      </h1>
      <!-- Realtime Sync Badge -->
      <div class="mt-1.5 flex items-center">
        <span id="syncStatusBadge" class="txt-badge font-bold bg-amber-100/80 text-amber-800 px-2.5 py-0.5 rounded-full border border-amber-200 shadow-xs flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate animate-spin text-amber-600"></i> Firebase 연동 준비 중...
        </span>
      </div>
    </div>
    
    <div class="flex items-center gap-1.5">
      <!-- 다크모드 토글 버튼 -->
      <button onclick="toggleDarkMode()" id="darkModeBtn" class="glass-btn w-10 h-10 rounded-2xl flex items-center justify-center text-stone-700 hover:text-stone-900 transition-colors shadow-sm" title="다크모드 토글">
        <i id="darkModeIcon" class="fa-solid fa-moon text-xs"></i>
      </button>
      
      <!-- 폰트 버튼 텍스트 -->
      <button onclick="toggleFontSettings()" class="glass-btn w-10 h-10 rounded-2xl flex items-center justify-center text-stone-700 hover:text-teal-600 font-extrabold txt-caption transition-colors shadow-sm gap-1" title="글꼴 및 크기 설정">
        <i class="fa-solid fa-font text-xs text-stone-700"></i>
      </button>
    </div>
  </div>

  <!-- Font & Size Control Panel -->
  <div id="fontSettingsPanel" class="hidden glass-card p-4 flex-col gap-3 border border-teal-200/60 shadow-xl rounded-2xl my-1 bg-white/90">
    <div class="flex justify-between items-center border-b border-stone-200/60 pb-2">
      <span class="txt-sub font-bold text-stone-700 flex items-center gap-1.5">
        <i class="fa-solid fa-sliders text-teal-600"></i> 텍스트 스타일 설정
      </span>
      <button onclick="toggleFontSettings()" class="text-stone-400 hover:text-stone-600 text-xs">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div>
      <span class="txt-caption font-bold text-stone-500 block mb-1.5">글꼴 선택</span>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="setFontFamily('noto')" id="font-noto" class="glass-btn py-1.5 txt-caption font-bold rounded-xl text-stone-700 glass-btn-active">
          기본 고딕
        </button>
        <button onclick="setFontFamily('gowun')" id="font-gowun" class="glass-btn py-1.5 txt-caption font-bold rounded-xl text-stone-700 font-gowun">
          둥근 고딕
        </button>
        <button onclick="setFontFamily('myeongjo')" id="font-myeongjo" class="glass-btn py-1.5 txt-caption rounded-xl text-stone-700 font-myeongjo font-bold">
          굵은 명조
        </button>
      </div>
    </div>

    <div>
      <span class="txt-caption font-bold text-stone-500 block mb-1.5">글자 크기</span>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="setFontSize('sm')" id="size-sm" class="glass-btn py-1.5 txt-caption font-bold rounded-xl text-stone-700">
          작게
        </button>
        <button onclick="setFontSize('md')" id="size-md" class="glass-btn py-1.5 txt-caption font-bold rounded-xl text-stone-700 glass-btn-active">
          보통
        </button>
        <button onclick="setFontSize('lg')" id="size-lg" class="glass-btn py-1.5 txt-caption font-bold rounded-xl text-stone-700">
          크게
        </button>
      </div>
    </div>
  </div>

  <!-- Segmented Navigation Control -->
  <div class="glass-pill p-1.5 grid grid-cols-2 gap-1">
    <button id="tabWrite" onclick="switchTab('write')" class="glass-btn glass-btn-active py-2.5 px-4 rounded-xl font-bold txt-sub text-stone-700 flex items-center justify-center gap-2">
      <i class="fa-solid fa-pen-to-square"></i> <span id="tabWriteLabel">점검 작성</span>
    </button>
    <button id="tabHistory" onclick="switchTab('history')" class="glass-btn py-2.5 px-4 rounded-xl font-bold txt-sub text-stone-500 flex items-center justify-center gap-2">
      <i class="fa-solid fa-clock-rotate-left"></i> 지난 기록
    </button>
  </div>
</header>

<!-- TAB 1: 점검 작성 페이지 -->
<main id="viewWrite" class="view-section flex flex-col gap-4">
  
  <div id="editNoticeBanner" class="hidden glass-card p-3 bg-amber-50/80 border-amber-200 flex justify-between items-center txt-sub font-bold text-amber-800">
    <span class="flex items-center gap-1.5">
      <i class="fa-solid fa-pen-to-square text-amber-600"></i> <span id="editNoticeText">기록을 수정하는 중입니다</span>
    </span>
    <button onclick="cancelEditMode()" class="text-stone-400 hover:text-stone-600 txt-caption underline font-normal">
      취소
    </button>
  </div>

  <!-- 1. 날짜 선택 -->
  <section class="glass-card p-5">
    <div class="flex justify-between items-center mb-2">
      <label class="txt-caption font-bold text-stone-500 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-regular fa-calendar-check text-teal-600"></i> 점검 날짜
      </label>
      <span id="sundayWeekBadge" class="txt-badge font-bold bg-teal-100/90 text-teal-800 px-2.5 py-0.5 rounded-full border border-teal-200/60 shadow-sm">
        -
      </span>
    </div>
    <input type="date" id="checkDate" onchange="onCheckDateChange()" class="glass-input w-full p-3 rounded-2xl font-semibold text-stone-700 txt-body">
  </section>

  <!-- 2. 음향 장비 점검 목록 -->
  <section class="glass-card p-5">
    <div class="flex justify-between items-center mb-3">
      <label class="txt-caption font-bold text-stone-500 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-list-check text-teal-600"></i> 음향 장비 점검
      </label>
      <span id="progressBadge" class="txt-badge bg-white/70 text-stone-600 font-bold px-2.5 py-0.5 rounded-full border border-white">0 / 5</span>
    </div>

    <div class="flex flex-col gap-2.5" id="checklistContainer">
      <div onclick="toggleCheck('vocal')" id="item-vocal" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-vocal" class="w-8 h-8 rounded-xl bg-amber-100/80 text-amber-700 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-microphone"></i>
          </div>
          <span id="text-vocal" class="font-bold txt-body text-stone-700 pointer-events-none">보컬 마이크</span>
        </div>
        <div id="check-vocal" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>

      <div onclick="toggleCheck('pastor')" id="item-pastor" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-pastor" class="w-8 h-8 rounded-xl bg-blue-100/80 text-blue-700 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-user-tie"></i>
          </div>
          <span id="text-pastor" class="font-bold txt-body text-stone-700 pointer-events-none">목사님 마이크</span>
        </div>
        <div id="check-pastor" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>

      <div onclick="toggleCheck('piano')" id="item-piano" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-piano" class="w-8 h-8 rounded-xl bg-purple-100/80 text-purple-700 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-music"></i>
          </div>
          <span id="text-piano" class="font-bold txt-body text-stone-700 pointer-events-none">피아노 마이크</span>
        </div>
        <div id="check-piano" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>

      <div onclick="toggleCheck('condenser')" id="item-condenser" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-condenser" class="w-8 h-8 rounded-xl bg-teal-100/80 text-teal-700 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-tower-broadcast"></i>
          </div>
          <span id="text-condenser" class="font-bold txt-body text-stone-700 pointer-events-none">컨덴서 마이크</span>
        </div>
        <div id="check-condenser" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>

      <div onclick="toggleCheck('mainSpeaker')" id="item-mainSpeaker" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-mainSpeaker" class="w-8 h-8 rounded-xl bg-rose-100/80 text-rose-700 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-volume-high"></i>
          </div>
          <span id="text-mainSpeaker" class="font-bold txt-body text-stone-700 pointer-events-none">본당 메인 스피커</span>
        </div>
        <div id="check-mainSpeaker" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. 점검자 선택 -->
  <section class="glass-card p-5">
    <div class="flex justify-between items-center mb-3">
      <label class="txt-caption font-bold text-stone-500 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-user-check text-teal-600"></i> 점검자 선택
      </label>
      <span class="txt-badge text-stone-400 font-small">다수 선택 가능</span>
    </div>
    <div class="grid grid-cols-3 gap-2.5">
      <button type="button" onclick="toggleInspector('김광수')" id="inspector-김광수" class="glass-btn py-3 px-2 rounded-2xl font-bold txt-sub text-stone-600 flex flex-col items-center gap-1">
        <i class="fa-solid fa-user text-stone-400 text-sm pointer-events-none"></i>
        <span class="pointer-events-none">김광수</span>
      </button>
      <button type="button" onclick="toggleInspector('이승수')" id="inspector-이승수" class="glass-btn py-3 px-2 rounded-2xl font-bold txt-sub text-stone-600 flex flex-col items-center gap-1">
        <i class="fa-solid fa-user text-stone-400 text-sm pointer-events-none"></i>
        <span class="pointer-events-none">이승수</span>
      </button>
      <button type="button" onclick="toggleInspector('유진')" id="inspector-유진" class="glass-btn py-3 px-2 rounded-2xl font-bold txt-sub text-stone-600 flex flex-col items-center gap-1">
        <i class="fa-solid fa-user text-stone-400 text-sm pointer-events-none"></i>
        <span class="pointer-events-none">유진</span>
      </button>
    </div>
  </section>

  <!-- 4. 영상 장비 점검 목록 -->
  <section class="glass-card p-5">
    <div class="flex justify-between items-center mb-3">
      <label class="txt-caption font-bold text-stone-500 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-video text-teal-600"></i> 영상 장비 점검
      </label>
      <span id="videoProgressBadge" class="txt-badge bg-white/70 text-stone-600 font-bold px-2.5 py-0.5 rounded-full border border-white">0 / 2</span>
    </div>

    <div class="flex flex-col gap-2.5">
      <div onclick="toggleCheck('youtube')" id="item-youtube" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-youtube" class="w-8 h-8 rounded-xl bg-red-100/80 text-red-600 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-brands fa-youtube text-sm"></i>
          </div>
          <span id="text-youtube" class="font-bold txt-body text-stone-700 pointer-events-none">유튜브 송출</span>
        </div>
        <div id="check-youtube" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>

      <div onclick="toggleCheck('recording')" id="item-recording" class="checkbox-pill glass-btn p-3.5 rounded-2xl flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-3">
          <div id="icon-recording" class="w-8 h-8 rounded-xl bg-indigo-100/80 text-indigo-600 flex items-center justify-center font-bold text-xs pointer-events-none">
            <i class="fa-solid fa-video"></i>
          </div>
          <span id="text-recording" class="font-bold txt-body text-stone-700 pointer-events-none">영상 녹화</span>
        </div>
        <div id="check-recording" class="w-6 h-6 rounded-full border border-stone-300 bg-white/50 flex items-center justify-center text-white text-[10px] pointer-events-none">
          <i class="fa-solid fa-check opacity-0"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. 메모 (단일 카드 통합 서식 툴바) -->
  <section class="glass-card p-5">
    <label class="block txt-caption font-bold text-stone-500 uppercase tracking-wider mb-3 flex items-center gap-1.5">
      <i class="fa-solid fa-note-sticky text-teal-600"></i> 메모
    </label>
    
    <div class="flex flex-col gap-4">
      <div>
        <span class="txt-sub font-bold text-stone-600 mb-1.5 block">이슈</span>
        <textarea id="issueProblem" rows="3" placeholder="예: 보컬 마이크 노이즈 발생&#10;스피커 좌측 출력 이상 등..." class="glass-input w-full p-3.5 rounded-2xl txt-body font-medium text-stone-700 whitespace-pre-wrap leading-relaxed"></textarea>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <span class="txt-sub font-bold text-stone-600 block">원인 & 해결</span>
          
          <!-- 통합 서식 카드 & '|' 구분선 -->
          <div class="glass-pill px-2 py-1 flex items-center gap-1 bg-white/50 border border-white/80 shadow-xs">
            <button type="button" onclick="applyFormat('bold')" class="px-2 py-0.5 hover:bg-white/60 rounded-md txt-caption font-bold text-stone-700 transition-colors" title="굵게">
              <i class="fa-solid fa-bold"></i>
            </button>

            <span class="text-stone-300 text-xs font-light select-none px-0.5">|</span>

            <button type="button" onclick="applyFormat('italic')" class="px-2 py-0.5 hover:bg-white/60 rounded-md txt-caption font-bold text-stone-700 transition-colors" title="비스듬하게">
              <i class="fa-solid fa-italic"></i>
            </button>

            <span class="text-stone-300 text-xs font-light select-none px-0.5">|</span>

            <button type="button" onclick="applyFormat('foreColor', '#e11d48')" class="px-2 py-0.5 hover:bg-white/60 rounded-md txt-caption font-bold text-rose-600 transition-colors" title="빨간색">
              빨
            </button>

            <span class="text-stone-300 text-xs font-light select-none px-0.5">|</span>

            <button type="button" onclick="applyFormat('foreColor', '#2563eb')" class="px-2 py-0.5 hover:bg-white/60 rounded-md txt-caption font-bold text-blue-600 transition-colors" title="파란색">
              파
            </button>

            <span class="text-stone-300 text-xs font-light select-none px-0.5">|</span>

            <button type="button" onclick="applyFormat('removeFormat')" class="px-2 py-0.5 hover:bg-white/60 rounded-md txt-caption text-stone-400 hover:text-stone-600 transition-colors" title="서식 초기화">
              <i class="fa-solid fa-eraser"></i>
            </button>
          </div>
        </div>

        <!-- contenteditable 입력창으로 실시간 폰트 서식 반영 -->
        <div id="issueSolution" contenteditable="true" data-placeholder="예: 케이블 재연결 완료&#10;페이더 수치 재조정으로 문제 해결..." class="glass-editor w-full p-3.5 rounded-2xl txt-body font-medium text-stone-700 min-h-[120px] max-h-[250px] overflow-y-auto leading-relaxed"></div>
      </div>
    </div>
  </section>

  <!-- 저장 버튼 -->
  <button type="button" id="btnSaveRecord" onclick="saveRecord()" class="btn-save-deep py-4 px-6 rounded-2xl font-bold txt-body flex items-center justify-center gap-2 mt-1 cursor-pointer">
    <i class="fa-solid fa-cloud-arrow-up text-base pointer-events-none"></i> <span id="btnSaveLabel" class="pointer-events-none">클라우드에 기록 저장하기</span>
  </button>

</main>

<!-- TAB 2: 지난 기록 볼 수 있는 페이지 -->
<main id="viewHistory" class="view-section hidden flex flex-col gap-3">
  <div class="flex justify-between items-center px-1">
    <h2 class="txt-body font-extrabold text-stone-700 flex items-center gap-2">
      <i class="fa-solid fa-folder-open text-teal-600"></i> 지난 점검 기록
    </h2>
    <span id="totalRecordCount" class="txt-badge font-bold bg-white/60 text-stone-600 px-3 py-1 rounded-full border border-white">총 0건</span>
  </div>

  <!-- 정렬 및 연도/월/메모 필터 아코디언 컨테이너 -->
  <div class="glass-card overflow-hidden transition-all duration-300">
    <button type="button" onclick="toggleFilterPanel()" class="w-full p-3.5 flex items-center justify-between text-left hover:bg-white/30 transition-colors">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-filter text-teal-600 text-sm"></i>
        <span class="txt-sub font-bold text-stone-700">기록 검색 & 정렬</span>
        <span id="filterSummaryBadge" class="txt-badge bg-teal-100/80 text-teal-800 font-bold px-2 py-0.5 rounded-full border border-teal-200">
          최신순
        </span>
      </div>
      <i id="filterChevronIcon" class="fa-solid fa-chevron-down text-stone-400 text-xs transition-transform duration-200"></i>
    </button>

    <div id="filterContentPanel" class="hidden p-3.5 border-t border-white/60 flex flex-col gap-3 bg-white/20">
      <div class="flex items-center justify-between gap-2">
        <span class="txt-caption font-bold text-stone-500">정렬 기준</span>
        <select id="sortOrderSelect" onchange="onFilterChange()" class="glass-input px-3 py-1.5 rounded-xl txt-caption font-bold text-stone-700 cursor-pointer">
          <option value="desc">📅 최신 날짜순</option>
          <option value="asc">⏳ 오래된 날짜순</option>
        </select>
      </div>

      <!-- 메모 필터 옵션 -->
      <div class="flex items-center justify-between gap-2 border-t border-white/40 pt-2.5">
        <span class="txt-caption font-bold text-stone-500">메모 필터</span>
        <select id="memoFilterSelect" onchange="onFilterChange()" class="glass-input px-3 py-1.5 rounded-xl txt-caption font-bold text-stone-700 cursor-pointer">
          <option value="all">📋 전체 보기</option>
          <option value="has_memo">메모 ⭕️</option>
          <option value="no_memo">메모 ❌️</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2 border-t border-white/40 pt-2.5">
        <div>
          <label class="block txt-badge font-bold text-stone-400 mb-1">연도 선택</label>
          <select id="yearFilterSelect" onchange="onFilterChange()" class="glass-input w-full px-2.5 py-1.5 rounded-xl txt-caption font-semibold text-stone-700 cursor-pointer">
            <option value="all">전체 연도</option>
          </select>
        </div>
        <div>
          <label class="block txt-badge font-bold text-stone-400 mb-1">월 선택</label>
          <select id="monthFilterSelect" onchange="onFilterChange()" class="glass-input w-full px-2.5 py-1.5 rounded-xl txt-caption font-semibold text-stone-700 cursor-pointer">
            <option value="all">전체 월</option>
            <option value="01">1월</option>
            <option value="02">2월</option>
            <option value="03">3월</option>
            <option value="04">4월</option>
            <option value="05">5월</option>
            <option value="06">6월</option>
            <option value="07">7월</option>
            <option value="08">8월</option>
            <option value="09">9월</option>
            <option value="10">10월</option>
            <option value="11">11월</option>
            <option value="12">12월</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="historyListContainer" class="flex flex-col gap-4 mt-1">
    <!-- Records populated by JS -->
  </div>
</main>

<!-- Custom Glassmorphism Confirmation Modal (Replacing confirm()) -->
